version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: digital_defenders_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: digital_defenders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  trueforge:
    image: truefoundry/trueforge:latest
    container_name: digital_defenders_trueforge
    ports:
      - "8790:8790"
    environment:
      - PORT=8790
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_defenders_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/digital_defenders
      - TRUEFORGE_URL=http://trueforge:8790
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEMO_MODE=true
      - IP_BLOCK_MODE=simulation
    depends_on:
      postgres:
        condition: service_healthy
      trueforge:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_defenders_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
